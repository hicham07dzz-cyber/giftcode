name: Build NEON RIFT Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - game/neon-rift-arcade
    paths:
      - "game/**"
      - ".github/workflows/build-neon-rift-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout game
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Prepare web game
        run: |
          mkdir -p game/android/www
          cp -R game/. game/android/www/
          rm -rf game/android/www/android game/android/www/www

      - name: Install Capacitor
        working-directory: game/android
        run: npm install

      - name: Create Android project
        working-directory: game/android
        run: npx cap add android

      - name: Sync game into Android project
        working-directory: game/android
        run: npx cap sync android

      - name: Build debug APK
        working-directory: game/android/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEON-RIFT-Android-APK
          path: game/android/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
